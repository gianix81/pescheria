; Limiti di upload applicati da PHP-FPM alla cartella pubblica.
;
; Serve dove non si controlla il php.ini di sistema (Railway, hosting condivisi):
; i default di PHP sono 2 MB per file e 8 MB per richiesta, sotto ai video del
; prodotto anche dopo la compressione nel browser.
;
; Se un upload grande fallisce con errore 413 il limite è del web server, non di
; PHP: va alzato anche client_max_body_size (nginx) o LimitRequestBody (Apache).

upload_max_filesize = 110M
post_max_size = 120M
memory_limit = 512M
max_file_uploads = 30
max_execution_time = 300
