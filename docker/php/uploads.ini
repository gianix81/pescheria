; Limiti di upload richiesti dal prodotto: i video verticali del pescato
; possono arrivare a 100 MB (MEDIA_MAX_VIDEO_MB).
; I default di PHP (2M / 8M) fanno fallire il caricamento a monte della
; validazione applicativa, con l'errore generico "uploaded".

upload_max_filesize = 110M
post_max_size = 120M
memory_limit = 512M
max_file_uploads = 30
max_execution_time = 300
max_input_time = 300
