# Ambiente di sviluppo locale completo: MySQL 8, Mailpit e applicazione PHP.
# Uso: docker compose up -d && docker compose exec app php artisan migrate --seed
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: pescheria
      DB_USERNAME: pescheria
      DB_PASSWORD: pescheria
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      mysql:
        condition: service_healthy
    command: php artisan serve --host=0.0.0.0 --port=8000

  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - .:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: pescheria
      DB_USERNAME: pescheria
      DB_PASSWORD: pescheria
    depends_on:
      mysql:
        condition: service_healthy
    command: php artisan queue:work --tries=3 --timeout=120

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - .:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: pescheria
      DB_USERNAME: pescheria
      DB_PASSWORD: pescheria
    depends_on:
      mysql:
        condition: service_healthy
    command: php artisan schedule:work

  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pescheria
      MYSQL_USER: pescheria
      MYSQL_PASSWORD: pescheria
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  mysql-data:
